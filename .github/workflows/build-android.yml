name: Build Web and Capacitor Android

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "capacitor.config.ts"
      - "capacitor.config.json"
      - "android/**"
      - ".github/workflows/build-android.yml"
      - "tools/validate_shared_data.py"
      - "assets/topics.json"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-capacitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Type-check and build React web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate shared topic data
        run: python3 tools/validate_shared_data.py

      - name: Type-check
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: upsc-map-trainer-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  capacitor-android:
    name: Build React/Capacitor Android bundle
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Capacitor debug APK and release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Upload Capacitor Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upsc-map-trainer-capacitor-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
