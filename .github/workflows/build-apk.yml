name: Build Native Kotlin Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"
      - "tools/validate_shared_data.py"
      - "assets/topics.json"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build Kotlin app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate shared topic data
        run: python3 tools/validate_shared_data.py

      - name: Run Kotlin unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble native debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: upsc-map-trainer-native-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
